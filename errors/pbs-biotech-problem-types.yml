  http_status: 422
  title: UCP discovery failed
  detail: "Unable to fetch agent profile: Missing profile uri"
  cause: >-
    tools/call was invoked without meta.ucp-agent.profile, or with a profile URI the server could not
    fetch. Discovery fails before the named tool executes.
  remediation: >-
