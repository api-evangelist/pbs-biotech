name: PBS Biotech Store Agent Commerce (UCP/MCP)
status: live
ownership_note: This MCP server is the Shopify platform's Universal Commerce Protocol implementation,
  running for the PBS Biotech merchant. It is served from shoppbsbiotech.com, a host PBS Biotech controls
  and links from the pbsbiotech.com primary navigation as "Shop"; the UCP profile names merchant "PBSBiotech"
  with merchant_origin "shoppbsbiotech.com". The tool surface is Shopify's, the catalog and the commercial
  relationship behind it are PBS Biotech's. PBS Biotech does NOT publish any first-party MCP server for
  its bioreactors or their control software.
deployment:
  mode: remote
  endpoint: https://shoppbsbiotech.com/api/ucp/mcp
  auth: none
  verified: probed
  note: tools/list answers anonymously. tools/call requires meta.ucp-agent.profile (an agent profile URI);
    a call without it returns HTTP 422 with JSON-RPC error -32001 "UCP discovery failed" / invalid_profile_url.
    Buyer authentication for order history uses the Shopify customer account OAuth server at account.shoppbsbiotech.com
    (see authentication/ and scopes/). The canonical UCP profile also lists the shop-domain form of the
    same endpoint, https://98dc59-0d.myshopify.com/api/ucp/mcp.
