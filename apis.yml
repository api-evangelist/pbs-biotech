aid: pbs-biotech
name: PBS Biotech
description: >-
  PBS Biotech, Inc. is a Camarillo, California manufacturer of single-use Vertical-Wheel bioreactor
  systems for cell and gene therapy manufacturing, scaling from 0.1 L benchtop vessels (PBS-Mini 0.1,
  PBS-Mini 0.5, MiniPRO) through 3 L, 15 L and 80 L production systems (PBS-3, PBS-15, PBS-80), together
  with single-use vessels, perfusion consumables, process development (CDO) services, field service and
  service plans. The company is a hardware and consumables business, not a software vendor: it publishes
  no developer program, no REST/GraphQL API and no machine-readable contract for its bioreactor control
  software, whose releases are documented only as versioned PDF release notes. Its one genuinely
  machine-callable, agent-facing surface is its own online store at shoppbsbiotech.com, a Shopify-hosted
  storefront that serves an llms.txt/agents.md agent instruction document, a Universal Commerce Protocol
  (UCP) merchant profile at /.well-known/ucp, and an anonymous MCP endpoint at /api/ucp/mcp exposing 13
  catalog, cart, checkout and order tools for agent-driven purchase of PBS Biotech consumables.
