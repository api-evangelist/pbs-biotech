  name: PBS Biotech Store Agent Commerce (UCP/MCP)
  description: >-
    The agent-callable commerce surface of the PBS Biotech online store. Implemented by Shopify on the
    company's own shoppbsbiotech.com host and advertised by the store's own /llms.txt, /agents.md and
    /robots.txt, it exposes a Universal Commerce Protocol (UCP) merchant profile at /.well-known/ucp and
    an MCP endpoint at /api/ucp/mcp whose anonymous tools/list returns 13 tools spanning catalog search
    and lookup, cart, checkout and order retrieval. Completing a checkout requires a buyer-approval step
    and a meta.idempotency-key.
